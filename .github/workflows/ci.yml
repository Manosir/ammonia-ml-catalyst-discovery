name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    env:
      PYTHONPATH: src
      MPLBACKEND: Agg

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Compile Python source
        run: |
          python -m compileall -q src tests intermediates

      - name: Run pytest
        run: python -m pytest -q

      - name: Verify canonical imports
        run: |
          python - <<'PY'
          from ammonia_ai import FEATURE_COLUMNS, TARGET_COLUMN
          from ammonia_ai.features import calculate_site_gcn, site_local_d_band_from_atoms

          assert len(FEATURE_COLUMNS) == 16
          assert TARGET_COLUMN == "delta_E_ads"
          print("Canonical imports: OK")
          PY
